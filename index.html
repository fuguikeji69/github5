<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            height: 100vh;
            background-color: #15171e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .code {
            font-size: 120px;
            font-weight: bold;
            color: #ff4757;
            line-height: 1;
            animation: shake 3s infinite ease-in-out;
        }
        .text {
            font-size: 22px;
            margin: 20px 0 10px;
            color: #ccc;
        }
        .desc {
            color: #888;
            margin-bottom: 35px;
        }
        .back-btn {
            padding: 12px 30px;
            background: #ff4757;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #ff2f43;
        }
        @keyframes shake {
            0%,100% {transform: translateX(0)}
            50% {transform: translateX(-8px)}
        }
    </style>
</head>
<body>
    <div class="code">兄弟没骗你呀</div>
    <div class="text">没骗你呀！一年650-850，飞机频道https://t.me/luck23333</div>
    <div class="desc"></div>
    <a href="/" class="back-btn">返回首页</a>
</body>
</html>
